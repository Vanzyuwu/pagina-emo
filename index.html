<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✦ VANZY ✦ mi rincón emo de internet</title>
  <meta name="description" content="VANZY: perfil personal estilo MySpace 2006 — música, juegos, fotos y libro de visitas. Hecho a mano con HTML, CSS y JS.">
  <meta name="theme-color" content="#0b0716">
  <meta property="og:title" content="✦ VANZY ✦">
  <meta property="og:description" content="Perfil personal estilo MySpace 2006, hecho a mano con HTML, CSS y JS.">
  <meta property="og:type" content="website">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">

  <!-- Fuentes: Metal Mania (títulos), VT323 (menús), Space Mono (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=VT323&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!-- Fondo de estrellas animadas (se genera desde script.js) -->
  <div class="estrellas" aria-hidden="true"></div>

  <a class="saltar" href="#contenido">saltar al contenido</a>

  <!-- Menú píldora emo: anclas a cada sección -->
  <header class="cabecera">
    <nav class="menu-pildora" aria-label="Menú principal">
      <a href="#inicio" class="menu-link">inicio</a>
      <a href="#musica" class="menu-link">música</a>
      <span class="menu-calavera" aria-hidden="true"><span class="menu-calavera-giro">💀</span></span>
      <a href="#juegos" class="menu-link">juegos</a>
      <a href="#fotos" class="menu-link">fotos</a>
      <a href="#foro" class="menu-link">foro</a>
    </nav>
  </header>

  <main class="contenedor" id="contenido" tabindex="-1">
    <!-- INICIO: título compacto + perfil MySpace -->
    <section class="seccion seccion-inicio" id="inicio" aria-labelledby="titulo-principal">
      <div class="titulo-wrap">
        <h1 class="titulo-principal" id="titulo-principal" data-texto="VANZY">VANZY</h1>
        <p class="subtitulo">✦ mi rincón oscuro de internet <span class="subtitulo-cute">uwu <span class="corazon" aria-hidden="true">♥</span></span> ✦</p>
      </div>

      <div class="grid-myspace">
        <!-- Columna izquierda: bio, Top Bandas, películas, libros -->
        <div class="columna columna-izq"></div>

        <!-- Columna derecha: status / mood, Spotify, cositas sobre mí -->
        <aside class="columna columna-der" aria-label="Sobre mí"></aside>
      </div>
    </section>

    <section class="seccion" id="musica" aria-labelledby="titulo-musica">
      <h2 class="titulo-seccion" id="titulo-musica">Música</h2>
      <p class="en-construccion">✦ en construcción ✦</p>
    </section>

    <section class="seccion" id="juegos" aria-labelledby="titulo-juegos">
      <h2 class="titulo-seccion" id="titulo-juegos">Juegos</h2>
      <p class="en-construccion">✦ en construcción ✦</p>
    </section>

    <section class="seccion" id="fotos" aria-labelledby="titulo-fotos">
      <h2 class="titulo-seccion" id="titulo-fotos">Fotos</h2>
      <p class="en-construccion">✦ en construcción ✦</p>
    </section>

    <section class="seccion" id="foro" aria-labelledby="titulo-foro">
      <h2 class="titulo-seccion" id="titulo-foro">Foro</h2>
      <p class="en-construccion">✦ en construcción ✦</p>
    </section>
  </main>

  <footer class="pie"></footer>

  <script src="script.js" defer></script>
</body>
</html>
