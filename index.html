<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✦ Vanzy ✦ ~ mi rincón emo</title>
  <meta name="description" content="Página personal retro estilo MySpace / Scene / Emo 2000s">

  <!-- Fuentes: Metal Mania (títulos), VT323 (menús), Space Mono (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=VT323&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!-- Fondo de estrellas animadas (se genera desde script.js) -->
  <div class="estrellas" aria-hidden="true"></div>

  <!-- Menú píldora (Paso 2) -->
  <header class="cabecera"></header>

  <main class="contenedor">
    <!-- Título gigante con glow (Paso 2) -->

    <div class="grid-myspace">
      <!-- Columna izquierda: bienvenida, Top Bandas, películas, libros -->
      <section class="columna columna-izq"></section>

      <!-- Columna derecha: Spotify, Cositas sobre mí, Status / Mood -->
      <aside class="columna columna-der"></aside>
    </div>
  </main>

  <footer class="pie"></footer>

  <script src="script.js" defer></script>
</body>
</html>
